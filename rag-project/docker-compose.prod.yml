# json-file rotation: caps each service at 30 MB of logs on the instance disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# mem_limit: measured 2026-10-29 (anon memory) app 424 MiB, redis 28 + 104 swapped, prometheus 21, caddy 8, grafana 187 (dev).
# Caps, not reservations: they sum past the 1.9 GiB host on purpose; a runaway container is OOM-killed and restarted instead of starving the rest.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy
    profiles: ["monitoring"]

  app:
    image: ghcr.io/yashbhosale789/personal-knowledge-rag:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    volumes:
      # Feedback SQLite (Phase 14.0): survives deploys and rollbacks; independent of the index.
      - feedback_data:/app/feedback
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis/redis-stack@sha256:5d5154123426693540ea6c1d9e638eae2bf2024879c839db6fcfdd7717e817c7
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      # 64 MB is ~18x today's 3.6 MB of data. Every app key has a TTL, so volatile-lru evicts cache entries first.
      - REDIS_ARGS=--maxmemory 64mb --maxmemory-policy volatile-lru

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    # 30d retention: the SLO window is 28 days.
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Only the Prometheus datasource is used: each bundled plugin is a ~35 MB backend process, and preinstall downloads 18 more (~500 MB).
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_PLUGINS_DISABLE_PLUGINS=grafana-azure-monitor-datasource,cloudwatch,elasticsearch,stackdriver,grafana-pyroscope-datasource,graphite,influxdb,jaeger,loki,mssql,mysql,opentsdb,grafana-postgresql-datasource,tempo,grafana-testdata-datasource,zipkin
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      # Alert email. Defaults keep compose valid when .env lacks these, so app deploys never depend on them.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${GF_SMTP_HOST:-smtp.gmail.com:587}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_USER:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/rag-pipeline-overview.json:/etc/grafana/dashboards/rag-pipeline-overview.json:ro
    depends_on:
      - prometheus

volumes:
  caddy_data:
  prometheus_data:
  grafana_data:
  feedback_data: