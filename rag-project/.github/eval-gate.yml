name: Eval Regression Gate

on:
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis/redis-stack:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-minilm

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clear stale eval state
        run: rm -f eval/eval_results.json eval/ragas_scores.json

      - name: Run pipeline on CI subset
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EVAL_DATASET_PATH: eval/ci_subset_dataset.json
        run: python eval/run_eval.py

      - name: Score results
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python eval/ragas_eval.py

      - name: Check thresholds
        run: python eval/check_thresholds.py
