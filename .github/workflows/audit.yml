name: Dependency Audit

# Advisories appear over time, so this reports on a schedule and on dependency changes
# instead of gating unrelated PRs.
on:
  pull_request:
    branches: [main]
    paths:
      - "rag-project/requirements*.txt"
      - "rag-project/requirements*.in"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag-project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # The lock is fully pinned, so no resolution is needed.
      # Ignored (reviewed 2026-10-23): chromadb 1.5.9 advisories that concern the Chroma
      # *server* (remote model loading, server RBAC/tenant authorization). We only use the
      # embedded PersistentClient and run no Chroma server; no fixed version exists yet.
      # Drop these flags once chromadb ships a fix.
      # Ignored (reviewed 2026-10-25): filelock 3.32.7 advisories, fixed in 4.2.1. filelock is
      # transitive and unstructured 0.27.34 (latest) requires filelock<4, so the lock cannot move
      # to a fixed version without downgrading unstructured. The advisories concern filelock's
      # SQLite ReadWriteLock (CVE-2026-112940 Linux, CVE-2026-112913 Windows) and Windows soft
      # locks (CVE-2026-112907); all need another local account on the same host. We call none of
      # these lock types, and chromadb's ReadWriteLock is its own thread-based class.
      # Reviewed 2026-10-29: ten more filelock 3.32.7 advisories (CVE-2026-112908..112912, 112915,
      # 112935, 112936, 112938, 112939), same blocker. Each needs another local account, or write
      # access to the lock files, to plant symlinks, hard links, markers or a crafted lock database.
      # The one lock type we do use is UnixFileLock (CVE-2026-112909), through huggingface-hub's model
      # cache; inside the single-user app container no other account can reach that directory.
      # Drop these flags once unstructured allows filelock>=4.2.1.
      - name: Audit runtime and dev locks
        run: |
          pip-audit -r requirements.txt -r requirements-dev.txt --no-deps --disable-pip \
            --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln CVE-2026-112940 \
            --ignore-vuln CVE-2026-112913 \
            --ignore-vuln CVE-2026-112907 \
            --ignore-vuln CVE-2026-112908 \
            --ignore-vuln CVE-2026-112909 \
            --ignore-vuln CVE-2026-112910 \
            --ignore-vuln CVE-2026-112911 \
            --ignore-vuln CVE-2026-112912 \
            --ignore-vuln CVE-2026-112915 \
            --ignore-vuln CVE-2026-112935 \
            --ignore-vuln CVE-2026-112936 \
            --ignore-vuln CVE-2026-112938 \
            --ignore-vuln CVE-2026-112939
