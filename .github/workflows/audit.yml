name: Dependency Audit

# Advisories appear over time, so this reports on a schedule and on dependency changes
# instead of gating unrelated PRs.
on:
  pull_request:
    branches: [main]
    paths:
      - "rag-project/requirements*.txt"
      - "rag-project/requirements*.in"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag-project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # The lock is fully pinned, so no resolution is needed.
      # Ignored (reviewed 2026-10-23): chromadb 1.5.9 advisories that concern the Chroma
      # *server* (remote model loading, server RBAC/tenant authorization). We only use the
      # embedded PersistentClient and run no Chroma server; no fixed version exists yet.
      # Drop these flags once chromadb ships a fix.
      - name: Audit runtime and dev locks
        run: |
          pip-audit -r requirements.txt -r requirements-dev.txt --no-deps --disable-pip \
            --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
