name: Build and Push Image

on:
  push:
    branches: [main]
    paths:
      - "rag-project/**"
      - "!rag-project/**/*.md"
      - "!rag-project/docker-compose*.yml"
      - "!rag-project/Caddyfile"
      - "!rag-project/prometheus.yml"
      - "!rag-project/eval/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: rag-project
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {}
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      AWS_DEFAULT_REGION: ap-southeast-2
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Deploy via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --document-name rag-deploy \
            --instance-ids "$INSTANCE_ID" \
            --parameters "sha=$GITHUB_SHA" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"
          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text || true
          echo "final status: $STATUS"
          [ "$STATUS" = Success ]
      - name: Smoke test
        run: |
          set -euo pipefail
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 "$SITE_URL/health" | grep -q '"pipeline_ready":true'; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "health check failed"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_URL/metrics")" = 404 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "$SITE_URL/ingest")" = 404 ]
          echo "smoke test passed"
