name: Code Quality

on:
  pull_request:
    branches: [main]

jobs:
  lint-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rag-project

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff and bandit
        run: pip install ruff==0.16.10 bandit==1.9.4

      - name: Run ruff
        run: ruff check .

      - name: Run bandit
        run: bandit -r src api eval scripts -x ./tests