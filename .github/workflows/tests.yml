name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "rag-project/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

# Deterministic, $0, no LLM calls. Required check: job `pytest`.
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rag-project
    services:
      redis:
        image: redis/redis-stack:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            rag-project/requirements.txt
            rag-project/requirements-dev.txt

      - name: Install dependencies (locked)
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
          pip check

      # Offline + an empty HF cache prove the default run never downloads a model.
      - name: Run tests (not slow) with coverage floor
        env:
          HF_HUB_OFFLINE: "1"
          HF_HOME: ${{ runner.temp }}/empty-hf-cache
          REDIS_HOST: localhost
        run: pytest -m "not slow" --cov --cov-report=term-missing --cov-fail-under=65

      # chunks.json only needs loading + splitting, not embeddings.
      - name: Build chunks (no embeddings)
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from ingest import save_chunks
          from config import CHUNKS_PATH, DATA_DIR
          from src.ingestion.chunker import chunk_documents
          from src.ingestion.loader import load_directory
          save_chunks(chunk_documents(load_directory(DATA_DIR)), CHUNKS_PATH)
          EOF

      - name: Validate golden dataset
        run: python -m eval.tools.validate_dataset
