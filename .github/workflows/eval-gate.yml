name: Eval Regression Gate

# Expensive and stochastic (LLM calls, provider rate limits), so it does not run on every
# push: only when pipeline code, config, data or the eval harness change, weekly, or on demand.
# A real regression fails the job; an incomplete run (rate limit/provider error) is reported
# as a warning and in the job summary instead of blocking (F-13). Not a required check.
on:
  pull_request:
    branches: [main]
    paths:
      - "rag-project/src/**"
      - "rag-project/config.py"
      - "rag-project/eval/**"
      - "rag-project/scripts/ingest.py"
      - "rag-project/data/**"
      - "rag-project/requirements.txt"
      - ".github/workflows/eval-gate.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    defaults:
      run:
        working-directory: rag-project
    services:
      redis:
        image: redis/redis-stack:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: rag-project/requirements.txt

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-minilm

      - name: Install dependencies
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run ingestion (build BM25 + vector index)
        run: python scripts/ingest.py

      - name: Clear stale eval state
        run: rm -rf eval/runs

      - name: Run pipeline on CI subset
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m eval.harness.generate --variants ci --ci-only --gap 45 || {
            echo "generate incomplete (rate limit or provider error); cooling down, then resuming failed items"
            sleep 90
            python -m eval.harness.generate --variants ci --ci-only --gap 45
          }

      - name: Judge answers
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m eval.harness.judge --variants ci

      # gate exit codes: 0 pass, 1 regression (blocks), 2 incomplete (reports)
      - name: Check gate
        run: |
          set +e
          python -m eval.harness.gate --variant ci | tee gate.txt
          code=${PIPESTATUS[0]}
          {
            echo "### Eval gate (corpus c1)"
            echo '```'
            cat gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Eval gate incomplete::generation or judging did not finish (rate limit or provider error); no regression was measured. See the job summary."
            exit 0
          fi
          exit "$code"

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true