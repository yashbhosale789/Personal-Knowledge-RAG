$kind: http-request
name: "Place wheel wedges/blocks (if available) to prevent vehicle movement."
description: "Expected: citation_check.grounded = false."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"Place wheel wedges/blocks (if available) to prevent vehicle movement.\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("not grounded", () => pm.expect(body.citation_check && body.citation_check.grounded).to.eql(false));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 2000
