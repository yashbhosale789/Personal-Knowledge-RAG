$kind: http-request
name: "17 abstain repeat - not cached"
description: "Expected: abstain. Abstain answers are never stored, so this must not be cached."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What is the warranty period for an Aventro Sedan?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("abstains, not cached", () => pm.expect(body.outcome).to.eql("abstain"));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 17000
