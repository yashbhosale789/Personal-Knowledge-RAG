$kind: http-request
name: "04 What time of day is best for a pregnant woman to travel by car?"
description: "Expected: answer. Ground truth: Early morning or evening, to avoid heat and traffic."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What time of day is best for a pregnant woman to travel by car?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      if (body.outcome !== "cached") pm.test("retrieves Advice for Pregnant Women While in a Car.pdf", () => pm.expect(body.sources).to.include("Advice for Pregnant Women While in a Car.pdf"));
      console.log(pm.info.requestName, "|", body.outcome, "|", (body.sources || []).join(", "), "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 4000
