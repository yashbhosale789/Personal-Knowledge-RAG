$kind: http-request
name: "01 What is the difference between tilt and telescopic steering adjustment?"
description: "Expected: answer. Ground truth: Tilt moves the wheel up and down; telescopic moves it closer to or farther from the driver."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What is the difference between tilt and telescopic steering adjustment?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      if (body.outcome !== "cached") pm.test("retrieves Adjusting the Steering Wheel.pdf", () => pm.expect(body.sources).to.include("Adjusting the Steering Wheel.pdf"));
      console.log(pm.info.requestName, "|", body.outcome, "|", (body.sources || []).join(", "), "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 1000
