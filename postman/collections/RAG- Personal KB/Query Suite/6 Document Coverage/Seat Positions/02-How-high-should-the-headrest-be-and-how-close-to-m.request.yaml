$kind: http-request
name: "02 How high should the headrest be and how close to my head?"
description: "Expected: answer. Ground truth: The top of the headrest level with the top of your head, and as close to the back of your head as possible."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"How high should the headrest be and how close to my head?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      if (body.outcome !== "cached") pm.test("retrieves Adjusting the Seat Positions.pdf", () => pm.expect(body.sources).to.include("Adjusting the Seat Positions.pdf"));
      console.log(pm.info.requestName, "|", body.outcome, "|", (body.sources || []).join(", "), "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 2000
