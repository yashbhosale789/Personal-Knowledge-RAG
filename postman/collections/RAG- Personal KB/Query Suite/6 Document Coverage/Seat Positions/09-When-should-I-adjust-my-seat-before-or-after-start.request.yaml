$kind: http-request
name: "09 When should I adjust my seat - before or after starting the engine?"
description: "Expected: answer. Ground truth: Before starting the engine, while the car is stationary."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"When should I adjust my seat - before or after starting the engine?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      if (body.outcome !== "cached") pm.test("retrieves Adjusting the Seat Positions.pdf", () => pm.expect(body.sources).to.include("Adjusting the Seat Positions.pdf"));
      console.log(pm.info.requestName, "|", body.outcome, "|", (body.sources || []).join(", "), "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 9000
