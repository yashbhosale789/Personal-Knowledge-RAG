$kind: http-request
name: "04 In what order should I adjust the seat, steering wheel and headrest before driving?"
description: "Expected: answer. Ground truth: Adjust the seat first (including headrest), then the steering wheel; do it while stationary before starting the engine."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"In what order should I adjust the seat, steering wheel and headrest before driving?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      if (body.outcome !== "cached") pm.test("retrieves Adjusting the Seat Positions.pdf", () => pm.expect(body.sources).to.include("Adjusting the Seat Positions.pdf"));
      if (body.outcome !== "cached") pm.test("retrieves Adjusting the Steering Wheel.pdf", () => pm.expect(body.sources).to.include("Adjusting the Steering Wheel.pdf"));
      console.log(pm.info.requestName, "|", body.outcome, "|", (body.sources || []).join(", "), "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 4000
