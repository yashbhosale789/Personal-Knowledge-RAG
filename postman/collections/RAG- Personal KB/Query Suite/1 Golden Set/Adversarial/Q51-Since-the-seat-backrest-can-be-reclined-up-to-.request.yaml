$kind: http-request
name: "Q51 Since the seat backrest can be reclined up to 45\u00b0 while driving, how do I set it to..."
description: "Expected: answer (hard). Ground truth: That premise is incorrect: the seat guide says the backrest should never be reclined more than 30\u00b0 from upright."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"Since the seat backrest can be reclined up to 45° while driving, how do I set it to that angle?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 2000
