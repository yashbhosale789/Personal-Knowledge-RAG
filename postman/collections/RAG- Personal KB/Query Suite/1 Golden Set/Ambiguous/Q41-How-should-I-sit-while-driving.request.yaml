$kind: http-request
name: "Q41 How should I sit while driving?"
description: "Expected: answer (medium). Ground truth: Sit upright. The seat guide says to adjust the backrest so you sit upright with your shoulders touching the seatback, and the pregnancy advice says to sit upright with your back straight and shoulders relaxed."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"How should I sit while driving?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 3000
