$kind: http-request
name: "Q40 What should I do if the lever is stuck?"
description: "Expected: answer (hard). Ground truth: For a stuck steering wheel lever, check for obstructions under or around the lever or consult your nearest Aventro Service Center. For a seat that is not moving, check for obstructions under the seat."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What should I do if the lever is stuck?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 2000
