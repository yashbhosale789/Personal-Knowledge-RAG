$kind: http-request
name: "Q42 How often should I take a break on a long drive?"
description: "Expected: answer (hard). Ground truth: The knowledge base gives this advice for pregnant drivers: stop every 60-90 minutes to get out, stretch your legs and walk a little. It does not give a general interval for other drivers."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"How often should I take a break on a long drive?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 4000
