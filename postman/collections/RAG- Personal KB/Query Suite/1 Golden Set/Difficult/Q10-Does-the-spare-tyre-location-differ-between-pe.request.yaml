$kind: http-request
name: "Q10 Does the spare tyre location differ between petrol and electric variants of the sam..."
description: "Expected: answer (hard). Ground truth: No. All variants including Petrol, Diesel, Electric, and Hybrid follow the same compartment arrangement for the spare tyre and toolkit."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"Does the spare tyre location differ between petrol and electric variants of the same Aventro model?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 3000
