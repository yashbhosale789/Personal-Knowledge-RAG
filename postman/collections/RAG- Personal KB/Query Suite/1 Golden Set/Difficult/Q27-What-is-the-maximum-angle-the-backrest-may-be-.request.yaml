$kind: http-request
name: "Q27 What is the maximum angle the backrest may be reclined from the upright position?"
description: "Expected: answer (easy). Ground truth: The backrest should never be more than 30\u00b0 from upright."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What is the maximum angle the backrest may be reclined from the upright position?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 6000
