$kind: http-request
name: "Q04 What steps should I take to safely park before changing a tyre?"
description: "Expected: answer (medium). Ground truth: You should pull over to a safe, flat location away from traffic, turn on your hazard lights, apply the handbrake, and place wheel wedges or blocks if available to prevent vehicle movement."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What steps should I take to safely park before changing a tyre?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 4000
