$kind: http-request
name: "Q26 What sensors are employed in some adaptive cruise control systems to improve object..."
description: "Expected: answer (easy). Ground truth: Lidar sensors or cameras are used in some systems for enhanced object detection and lane tracking."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What sensors are employed in some adaptive cruise control systems to improve object detection and lane tracking?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 18000
