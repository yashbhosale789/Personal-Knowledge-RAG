$kind: http-request
name: "Q16 How does Adaptive Cruise Control control a vehicle\u2019s speed in traffic?"
description: "Expected: answer (easy). Ground truth: Adaptive Cruise Control automatically adjusts the vehicle\u2019s cruising speed to keep a safe following distance from the cars ahead."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"How does Adaptive Cruise Control control a vehicle’s speed in traffic?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 8000
