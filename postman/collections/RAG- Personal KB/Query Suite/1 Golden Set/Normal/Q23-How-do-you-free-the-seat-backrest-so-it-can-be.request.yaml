$kind: http-request
name: "Q23 How do you free the seat backrest so it can be adjusted?"
description: "Expected: answer (easy). Ground truth: Lean forward slightly and pull or rotate the control to release the backrest."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"How do you free the seat backrest so it can be adjusted?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 15000
