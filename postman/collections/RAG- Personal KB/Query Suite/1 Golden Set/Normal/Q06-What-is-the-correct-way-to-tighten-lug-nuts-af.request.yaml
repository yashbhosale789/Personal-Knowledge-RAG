$kind: http-request
name: "Q06 What is the correct way to tighten lug nuts after fitting the spare tyre?"
description: "Expected: answer (medium). Ground truth: After fitting the spare tyre, the lug nuts should be tightened using a star pattern to ensure even pressure across the wheel."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What is the correct way to tighten lug nuts after fitting the spare tyre?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 5000
