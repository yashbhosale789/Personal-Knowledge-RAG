$kind: http-request
name: "Q57 What phone number can I call for Aventro Motors support?"
description: "Expected: answer (easy). Ground truth: Call Aventro Motors Customer Support at +91 124 1234567."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What phone number can I call for Aventro Motors support?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 19000
