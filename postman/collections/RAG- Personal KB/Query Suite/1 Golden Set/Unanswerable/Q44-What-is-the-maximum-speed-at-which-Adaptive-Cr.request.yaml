$kind: http-request
name: "Q44 What is the maximum speed at which Adaptive Cruise Control can be activated?"
description: "Expected: abstain (hard). Ground truth: The document does not state a maximum activation speed for Adaptive Cruise Control."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What is the maximum speed at which Adaptive Cruise Control can be activated?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("abstains", () => pm.expect(body.outcome).to.eql("abstain"));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 3000
