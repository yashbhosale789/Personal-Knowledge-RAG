$kind: http-request
name: "Q45 How much does it cost to replace a seat adjustment lever?"
description: "Expected: abstain (medium). Ground truth: The seat guide does not give any pricing or replacement cost information."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"How much does it cost to replace a seat adjustment lever?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("abstains", () => pm.expect(body.outcome).to.eql("abstain"));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 4000
