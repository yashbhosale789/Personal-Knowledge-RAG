$kind: http-request
name: "Q46 What torque should I use when tightening the lug nuts?"
description: "Expected: abstain (hard). Ground truth: The tyre guide only says to tighten the lug nuts in a star pattern; it does not give a torque specification."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What torque should I use when tightening the lug nuts?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("abstains", () => pm.expect(body.outcome).to.eql("abstain"));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 5000
