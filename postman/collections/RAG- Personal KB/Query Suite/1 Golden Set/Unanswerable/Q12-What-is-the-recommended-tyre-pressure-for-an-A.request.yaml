$kind: http-request
name: "Q12 What is the recommended tyre pressure for an Aventro Hatchback spare tyre?"
description: "Expected: abstain (hard). Ground truth: The document does not specify the recommended tyre pressure for any Aventro model. This information is not available in the tyre-changing guide."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"What is the recommended tyre pressure for an Aventro Hatchback spare tyre?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("abstains", () => pm.expect(body.outcome).to.eql("abstain"));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 1000
