$kind: http-request
name: "Q33 Should I adjust the steering wheel or the seat first, and how do I set the seat dis..."
description: "Expected: answer (hard). Ground truth: Adjust your seat first, before the steering wheel. To set the distance from the pedals, slide the seat forward or backward until your feet reach the pedals comfortably while keeping a slight bend at your knees."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"Should I adjust the steering wheel or the seat first, and how do I set the seat distance from the pedals?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 3000
