$kind: http-request
name: "Q38 My steering wheel lever is stuck and I'm in Pune. What should I check first, and wh..."
description: "Expected: answer (hard). Ground truth: First check for obstructions under or around the lever; if that does not solve it, consult your nearest Aventro Service Center. In Pune the service center is in Wakad."
url: https://yash-pkb-rag.duckdns.org/query
method: POST
body:
  type: json
  content: "{\n  \"query\": \"My steering wheel lever is stuck and I'm in Pune. What should I check first, and where is the nearest service center?\"\n}"
auth:
  type: bearer
  credentials:
    token: "{{vault:PROD_API_KEY}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("answers", () => pm.expect(body.outcome).to.be.oneOf(["answer", "answer_low_confidence", "cached"]));
      console.log(pm.info.requestName, "|", body.outcome, "|", body.provider, "|", Math.round(body.latency_ms || 0) + " ms");
settings: {}
order: 8000
