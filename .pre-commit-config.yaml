# Optional: pip install pre-commit && pre-commit install
# Runs the same ruff gate as CI. Tests are not a hook: importing torch makes them too slow per commit.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd rag-project && ruff check .'
        language: system
        types: [python]
        pass_filenames: false
